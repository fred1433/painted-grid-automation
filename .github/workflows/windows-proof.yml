name: windows-proof
on:
  workflow_dispatch:
  push:
    paths-ignore: ['proof/**', '**/*.md', 'docs/**']
jobs:
  proof:
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Pinned OCR model
        shell: pwsh
        run: ./tools/fetch-tessdata.ps1
      - name: Build
        shell: pwsh
        run: |
          dotnet build src/Ledger.App/Ledger.App.csproj -c Release -o out/app
          dotnet build src/LedgerMcp/LedgerMcp.csproj -c Release -o out/mcp
          dotnet build src/LedgerOperator/LedgerOperator.csproj -c Release -o out/op
          dotnet build tests/Scenarios/Scenarios.csproj -c Release -o out/scenarios
          dotnet build tools/RunAtIntegrity/RunAtIntegrity.csproj -c Release -o out/run-at-integrity
      - name: Versions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force proof-run | Out-Null
          $v = @("runner image: $env:ImageOS $env:ImageVersion", "commit: $env:GITHUB_SHA", "run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID")
          $v += (dotnet --list-runtimes)
          $v += "eng.traineddata sha256: " + (Get-FileHash -Algorithm SHA256 tessdata/eng.traineddata).Hash.ToLowerInvariant()
          $v += (dotnet list src/LedgerMcp/LedgerMcp.csproj package)
          $v += "screen: " + (Get-CimInstance Win32_VideoController | ForEach-Object { "$($_.Name) $($_.CurrentHorizontalResolution)x$($_.CurrentVerticalResolution)" })
          $v | Tee-Object -FilePath proof-run/versions.txt
      - name: Scenarios (MCP client -> stdio server -> screen capture -> SendInput)
        shell: pwsh
        run: ./out/scenarios/scenarios.exe --app out/app/LedgerApp.exe --server out/mcp/ledger-mcp.exe --operator out/op/ledger-operator.exe --tessdata tessdata --launcher out/run-at-integrity/run-at-integrity.exe --out proof-run --work work --repo . --skip 22
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-run
          path: proof-run

  guard-tests:
    # Operation store and operator CLI, no desktop needed.
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Guard tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force proof-guard | Out-Null
          dotnet build tests/Guard.Tests/Guard.Tests.csproj -c Release -o out/guard-tests
          ./out/guard-tests/guard-tests.exe | Tee-Object -FilePath proof-guard/guard-tests.txt
          $code = $LASTEXITCODE
          "commit: $env:GITHUB_SHA" | Add-Content proof-guard/guard-tests.txt
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-guard
          path: proof-guard

  dpi-150:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Pinned OCR model
        shell: pwsh
        run: ./tools/fetch-tessdata.ps1
      - name: Build
        shell: pwsh
        run: |
          dotnet build src/Ledger.App/Ledger.App.csproj -c Release -o out/app
          dotnet build src/LedgerMcp/LedgerMcp.csproj -c Release -o out/mcp
          dotnet build src/LedgerOperator/LedgerOperator.csproj -c Release -o out/op
          dotnet build tests/Scenarios/Scenarios.csproj -c Release -o out/scenarios
          dotnet build tools/DisplaySetup/DisplaySetup.csproj -c Release -o out/display
      - name: Set 1920x1080 at 150 %
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force proof-dpi | Out-Null
          ./out/display/display-setup.exe 1920 1080 150 | Tee-Object -FilePath proof-dpi/display-setup.txt
          exit $LASTEXITCODE
      - name: DPI scenario
        shell: pwsh
        run: ./out/scenarios/scenarios.exe --app out/app/LedgerApp.exe --server out/mcp/ledger-mcp.exe --operator out/op/ledger-operator.exe --tessdata tessdata --out proof-dpi --work work --repo . --only 22
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-dpi
          path: proof-dpi

  run-demo-script:
    # Checks that the README's replay command works as written.
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: ./run-demo.ps1 -Only 01,02,21
        shell: pwsh
        run: ./run-demo.ps1 -Only 01,02,21
